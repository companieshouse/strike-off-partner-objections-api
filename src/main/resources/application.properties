spring.application.name=strike-off-partner-objections-api

management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:/strike-off-partner-objections-api}
management.endpoints.web.path-mapping.health=${MANAGEMENT_ENDPOINTS_WEB_PATH_MAPPING_HEALTH:healthcheck}

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.uk.gov.companieshouse.strikeoffpartnerobjectionsapi=${LOGGING_LEVEL_UK_GOV_COMPANIESHOUSE_STRIKEOFFPARTNEROBJECTIONSAPI:INFO}

spring.data.mongodb.uri=${MONGODB_URL:mongodb://127.0.0.1:27017/strike_off_partner_objections}
spring.data.mongodb.database=${MONGODB_DATABASE:strike_off_partner_objections}
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

# spring.data.* properties are not recognized by Spring Boot. Therefore, we need to set the spring.mongodb.* properties to ensure that the application can connect to MongoDB correctly.
spring.mongodb.uri=${MONGODB_URL:mongodb://127.0.0.1:27017/strike_off_partner_objections}
spring.mongodb.database=${MONGODB_DATABASE:strike_off_partner_objections}
spring.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVER_URL:localhost:9092}
kafka.topic.strikeoff.partner.objections=${KAFKA_TOPIC_STRIKEOFF_OBJECTIONS:strike-off-partner-objections-incoming}
kafka.config.acks=${KAFKA_ACKS:all}
kafka.max-block-milliseconds=${KAFKA_MAX_BLOCK_MILLISECONDS:60000}
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:3}
spring.kafka.producer.enable-idempotence=${KAFKA_PRODUCER_IDEMPOTENCE:true}
