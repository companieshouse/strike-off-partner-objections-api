spring.application.name=strike-off-partner-objections-api
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/strike-off-partner-objections-api
management.endpoints.web.path-mapping.health=healthcheck
management.health.mongo.enabled=false

logging.level.root=INFO
logging.level.uk.gov.companieshouse.strikeoffpartnerobjectionsapi=INFO

spring.mongodb.uri=${MONGODB_URL}
spring.mongodb.auto-index-creation=true

# Spring MongoDB
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
