management.endpoints.web.base-path=/strike-off-partner-objections-api
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
spring.application.name=strike-off-partner-objections-api
spring.main.allow-bean-definition-overriding=true

spring.mongodb.database=strike_off_partner_objections
spring.mongodb.auto-index-creation=true

spring.kafka.bootstrap-servers=localhost:9092
kafka.topic.strikeoff.partner.objections=${KAFKA_TOPIC_STRIKEOFF_OBJECTIONS:strike-off-partner-objections-incoming}
kafka.config.acks=${KAFKA_ACKS:-1}
kafka.max-block-milliseconds=${KAFKA_MAX_BLOCK_MILLISECONDS:60000}
