spring.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017/strike_off_partner_objections}
management.endpoints.web.base-path=/strike-off-partner-objections-api
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
spring.application.name=strike-off-partner-objections-api
spring.main.allow-bean-definition-overriding=true
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/strike_off_partner_objections
spring.data.mongodb.database=strike_off_partner_objections
spring.data.mongodb.auto-index-creation=true
